data:
  raw_train: data/raw/train.csv
  raw_later: data/raw/later.csv
  holdout: data/raw/holdout_features.csv
  cleaned_train: data/processed/train_cleaned.csv
  findings_path: reports/findings.yaml

cleaning:
  target_col: grain_kg
  date_col: date
  id_col: record_id
  leaking_columns:
    - kg_entered_in_epos_at_close
  unit_mixup:
    column: stock_kg_morning
    group_col: block
    group_value: Block South
    factor: 1000
    threshold: 10000.0
  sentinel:
    column: biometric_failures
    value: 9999
  spelling:
    column: shop_area
    mapping:
      tri.: tribal
      rur.: rural
      urb.: urban

model:
  target: grain_kg
  random_state: 42
  test_size: 0.2
  cv_folds: 5
  artifact_path: models/model.joblib
  features:
    - cards_attached
    - working_hours
    - biometric_failures
    - temp_c
    - stock_kg_morning
    - days_to_month_end
    - shop_area
    - block
  numeric_features:
    - cards_attached
    - working_hours
    - biometric_failures
    - temp_c
    - stock_kg_morning
    - days_to_month_end
  categorical_features:
    - shop_area
    - block
  candidates:
    - name: ridge_alpha_1
      type: ridge
      params:
        alpha: 1.0
    - name: ridge_alpha_10
      type: ridge
      params:
        alpha: 10.0
    - name: poly2_ridge_10
      type: poly_ridge
      params:
        degree: 2
        alpha: 10.0
    - name: huber_regressor
      type: huber
      params:
        alpha: 0.0001
        max_iter: 500
    - name: gradient_boosting
      type: gradient_boosting
      params:
        n_estimators: 200
        learning_rate: 0.05
        max_depth: 3
    - name: random_forest
      type: random_forest
      params:
        n_estimators: 200
        max_depth: 12

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: mp279-ration-distribution
  registered_model_name: mp279-grain-predictor
  champion_alias: champion

prediction:
  output_path: predictions/holdout_predictions.csv
